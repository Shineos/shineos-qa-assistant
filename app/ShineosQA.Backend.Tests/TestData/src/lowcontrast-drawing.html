<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>low-contrast scan fixture</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  body { margin: 0; width: 297mm; height: 210mm; position: relative; background: #ffffff; font-family: "Yu Gothic", "Meiryo", sans-serif; }
  .note { position: absolute; top: 20mm; left: 25mm; font-size: 14pt; color: #a8a8a8; line-height: 2; }
  .dim { position: absolute; top: 60mm; left: 25mm; font-size: 12pt; color: #b0b0b0; line-height: 2; }
  .titleblock { position: absolute; right: 8mm; bottom: 8mm; width: 110mm; border: 1px solid #909090; font-size: 15pt; color: #909090; padding: 4mm; line-height: 1.9; }
</style></head><body>
  <div class="note">
    溶接はJIS Z 3141に準拠すること。溶接後は外観検査を行い、尺寸公差はJIS B 0405の普通級とする。<br>
    仕上げ面のバリ取りを完了後に検査すること。表面処理は 防錆油を塗布すること。<br>
    取付ボルトは M10 を使用し、締付トルクは 24N·m とする。
  </div>
  <div class="dim">
    全長 260 ／ 全幅 148 ／ 板厚 6.0<br>
    取付穴 4-Ø12.5（ボルト孔）<br>
    面粗度 6.3S（機械仕上げ面）
  </div>
  <div class="titleblock">
    図番 ST-7789B<br>
    品名 取付ブラケット<br>
    材質 SSCP<br>
    縮尺 1:2<br>
    改訂 B
  </div>
</body></html>
