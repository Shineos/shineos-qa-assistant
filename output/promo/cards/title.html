<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;}
  /* 背景は明るい配色。このカードが動画の冒頭（1フレーム目）になり、
     同時にYouTubeサムネイルの元画像にもなる（build-promo.js が1280x720へ縮小） */
  body{
    font-family:"Yu Gothic","Yu Gothic UI","Meiryo",sans-serif;
    background:linear-gradient(135deg,#ffffff 0%,#eefaf5 55%,#ddf3ea 100%);
    position:relative;
  }
  .blob1{position:absolute;width:1140px;height:1140px;border-radius:50%;
    background:radial-gradient(circle,#10a37f22 0%,#10a37f00 70%);top:-360px;right:-240px;}
  .blob2{position:absolute;width:960px;height:960px;border-radius:50%;
    background:radial-gradient(circle,#10a37f18 0%,#10a37f00 70%);bottom:-330px;left:-225px;}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:0;}
  .icon{width:180px;height:180px;display:block;filter:drop-shadow(0 16px 34px #10a37f44);}
  .icon img{width:180px;height:180px;display:block;}
  /* 見出しはJSが幅に合わせて最大サイズへ自動調整する（改行なしの1行） */
  h1{margin:54px 0 0;font-size:150px;font-weight:800;color:#16211c;
    letter-spacing:.02em;white-space:nowrap;line-height:1.1;text-align:center;}
  .sub{margin-top:27px;font-size:51px;color:#4b5b53;font-weight:700;white-space:nowrap;}
  .badges{display:flex;gap:24px;margin-top:45px;}
  .badge{font-size:39px;font-weight:700;color:#0c3f32;background:#ffffff;
    border:3px solid #bfe6d9;padding:16px 39px;border-radius:999px;
    box-shadow:0 9px 27px #0a3a2e12;white-space:nowrap;}
</style>
</head>
<body>
  <div class="blob1"></div><div class="blob2"></div>
  <div class="wrap">
    <div class="icon"><img src="store-logo-1080.png" alt="社内知恵袋"></div>
    <h1 id="headline">社内の知恵を、すぐ隣に。</h1>
    <div class="sub">社内知恵袋 ― 完全オフライン社内Q&amp;Aアプリ</div>
    <div class="badges">
      <div class="badge">🔒 資料は外に出ない</div>
      <div class="badge">💬 出典付きで回答</div>
      <div class="badge">⚡ CPUのみで動作</div>
    </div>
  </div>
  <script>
    // 見出しを「1行のまま」「左右の余白を確保した最大サイズ」に自動フィットさせる。
    // 文言を変えても自動で収まるので、手動でのサイズ調整は不要。
    (function () {
      var h = document.getElementById('headline');
      var maxW = 1740;              // 左右に90pxずつ余白を残す
      var size = 240;
      h.style.fontSize = size + 'px';
      while (size > 60 && h.getBoundingClientRect().width > maxW) {
        size -= 2;
        h.style.fontSize = size + 'px';
      }
    })();
  </script>
</body>
</html>
