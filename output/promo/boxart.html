<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>box art 1080</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
    background: linear-gradient(135deg, #041d18 0%, #0a4a3a 46%, #0f8a6c 100%);
    color: #fff;
  }
  .glow {
    position: absolute; width: 1100px; height: 1100px; border-radius: 50%;
    background: radial-gradient(circle, rgba(126,226,196,.24) 0%, rgba(126,226,196,0) 62%);
    right: -300px; top: -300px;
  }
  .glow2 {
    position: absolute; width: 800px; height: 800px; border-radius: 50%;
    background: radial-gradient(circle, rgba(16,163,127,.32) 0%, rgba(16,163,127,0) 60%);
    left: -280px; bottom: -280px;
  }
  .canvas {
    position: relative; width: 1080px; height: 1080px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .icon {
    width: 230px; height: 230px; border-radius: 54px;
    background: linear-gradient(160deg, #34d3a6, #0f8a6c);
    display: flex; align-items: center; justify-content: center; font-size: 122px;
    box-shadow: 0 18px 46px rgba(0,0,0,.4);
    margin-bottom: 58px;
  }
  .name { font-size: 96px; font-weight: 800; letter-spacing: .02em; margin-bottom: 18px; }
  .en { font-size: 34px; font-weight: 600; color: #9fe3cb; letter-spacing: .22em; margin-bottom: 54px; }
  .tag {
    font-size: 33px; font-weight: 800; color: #fff;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px; padding: 18px 44px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="canvas">
    <div class="icon">📖</div>
    <div class="name">社内知恵袋</div>
    <div class="en">ShineosQA</div>
    <div class="tag">完全オフライン社内Q&amp;Aツール</div>
  </div>
</body>
</html>
