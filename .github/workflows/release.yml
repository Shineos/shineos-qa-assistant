# 社内知恵袋 v2 - 自動ビルド（llama.cpp直接実行アーキテクチャ）
#
# - v* タグを push すると: Windows ランナー上で
#     Web UI (npm) → バックエンド自己完結publish (dotnet) → WebView2ラッパー (csc)
#     → llama.cppエンジンDL → Inno Setup 6 で **モデル非同梠の軽量インストーラ（約200MB）**
#     を生成し、Actions成果物 + Release に添付
# - AIモデル（GGUF）はインストーラに同梱しない: 初回起動時のウィザード（または設定→AIモデル）
#   でアプリ内からダウンロードする（Models.cs / wizard.ts の既存DLフロー・SHA256検証付き）
# - SignPath署名は Secrets 設定後に別ステップで追加する（本ワークフローでは未署名）
#
# CIで調達する資産（ローカル開発資産の代替）:
#   - WebView2 DLL: NuGet Microsoft.Web.WebView2 から抽出
#   - エンジン: 公式プリビルドをDL（モデルは同梱しないためDL不要）
name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  LLAMA_RELEASE_URL: https://github.com/ggml-org/llama.cpp/releases/download/b10936/llama-b10936-bin-win-cpu-x64.zip
  WEBVIEW2_NUGET: https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4129.50/microsoft.web.webview2.1.0.4129.50.nupkg

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "building ShineosQA $v"

      # ---- 1) Web UI ----
      - name: Build Web UI
        shell: pwsh
        run: |
          cd app/ShineosQA.Web
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "web build failed" }

      # ---- 1.5) 単体テスト（拡張パック導入でテスト件数が増加したためゲート化。dev-v2.md §7 backlog対応） ----
      - name: Run backend tests
        shell: pwsh
        run: |
          dotnet test app/ShineosQA.Backend.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw "backend tests failed" }

      # ---- 2) バックエンド（自己完結publish。csprojがWeb distをwwwrootとして取り込む） ----
      - name: Publish backend
        shell: pwsh
        run: |
          dotnet publish app/ShineosQA.Backend -c Release -r win-x64 --self-contained true -o output/backend-pub
          if ($LASTEXITCODE -ne 0) { throw "backend publish failed" }
          if (-not (Test-Path 'output/backend-pub/ShineosQA.Backend.dll')) { throw "backend dll missing" }

      # ---- 3) WebView2 ラッパー（.NET Framework csc + NuGet抽出DLL） ----
      - name: Build WebView2 wrapper
        shell: pwsh
        run: |
          $dst = 'dist/ShineosQA.App'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP 'wv2.zip'
          curl.exe -L --fail --retry 3 -o $tmp $env:WEBVIEW2_NUGET
          if ($LASTEXITCODE -ne 0) { throw "webview2 nuget download failed" }
          $pkg = Join-Path $env:RUNNER_TEMP 'wv2'
          Expand-Archive $tmp -DestinationPath $pkg -Force
          Copy-Item "$pkg/lib/net462/Microsoft.Web.WebView2.Core.dll" $dst -Force
          Copy-Item "$pkg/lib/net462/Microsoft.Web.WebView2.Wpf.dll" $dst -Force
          Copy-Item "$pkg/runtimes/win-x64/native/WebView2Loader.dll" $dst -Force
          pwsh -NoProfile -ExecutionPolicy Bypass -File app/ShineosQA.App/build-v2.ps1
          if ($LASTEXITCODE -ne 0) { throw "wrapper build failed" }
          if (-not (Test-Path "$dst/ShineosQA.exe")) { throw "ShineosQA.exe missing" }

      # ---- 4) llama.cpp エンジン（公式プリビルドCPU版 b10936） ----
      - name: Download llama.cpp engine
        shell: pwsh
        run: |
          $dst = 'spikes/phase0/engine/cpu'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP 'llama.zip'
          curl.exe -L --fail --retry 3 -o $tmp $env:LLAMA_RELEASE_URL
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp download failed" }
          Expand-Archive $tmp -DestinationPath $dst -Force
          if (-not (Test-Path "$dst/llama-server.exe")) { throw "llama-server.exe missing after extract" }

      # ---- 5) モデルGGUFは同梱しない（初回起動時のウィザードでアプリ内DL。Models.cs/wizard.tsの既存フロー） ----

      # ---- 6) Inno Setup 6.7.3（公式リリースから直接導入。7系はNon-commercialのため不使用） ----
      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $iscc = 'C:\InnoSetup\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            curl.exe -L --fail --retry 3 -o "$env:TEMP\innosetup.exe" https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup download failed" }
            $p = Start-Process -FilePath "$env:TEMP\innosetup.exe" `
              -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\InnoSetup') `
              -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Inno Setup installer exit code: $($p.ExitCode)" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

      - name: Build installer (lite — AI models are downloaded on first run)
        id: build
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          # /DLiteBuild: モデルGGUFを同梱しない（初回起動時のウィザードでアプリ内DL）
          & 'C:\InnoSetup\ISCC.exe' "/DMyAppVersion=$ver" '/DLiteBuild' 'installer/installer-v2.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $exe = "dist/ShineosQA-Setup-$ver.exe"
          if (-not (Test-Path $exe)) { throw "installer exe not found: $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "hash=$hash" >> $env:GITHUB_OUTPUT
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## ShineosQA-Setup-$ver.exe`n`n- SHA256: \`$hash\``n- Size: $([math]::Round((Get-Item $exe).Length/1MB,1)) MB（モデル非同梱・初回起動時にアプリ内DL）"

      # ---- 7) MSIXビルド（Store提出用・Microsoft再署名のため署名なしでOK） ----
      - name: Build MSIX package
        shell: pwsh
        run: |
          # makeappx をSDK BuildTools NuGetから取得
          $tools = Join-Path $env:RUNNER_TEMP 'msixtools'
          curl.exe -L --fail --retry 3 -o "$env:RUNNER_TEMP\sdkbuildtools.nupkg" "https://api.nuget.org/v3-flatcontainer/microsoft.windows.sdk.buildtools/10.0.26100.1742/microsoft.windows.sdk.buildtools.10.0.26100.1742.nupkg"
          $nupkgDir = Join-Path $env:RUNNER_TEMP 'nupkg'
          Expand-Archive "$env:RUNNER_TEMP\sdkbuildtools.nupkg" -DestinationPath $nupkgDir -Force
          # .nupkgはzipとして開けないため拡張子変更
          Copy-Item "$env:RUNNER_TEMP\sdkbuildtools.nupkg" "$env:RUNNER_TEMP\sdkbuildtools.zip" -Force
          Expand-Archive "$env:RUNNER_TEMP\sdkbuildtools.zip" -DestinationPath $nupkgDir -Force
          $makeappx = (Get-ChildItem $nupkgDir -Recurse -Filter 'makeappx.exe' | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          if (-not $makeappx) { throw 'makeappx.exe not found' }

          # MSIXステージング（backend-pubとモデルを再利用）
          $ver = '${{ steps.ver.outputs.version }}'
          # バージョンを4-partに（2.0.3 → 2.0.3.0）
          $msixVer = if ($ver.Split('.').Count -eq 3) { "$ver.0" } else { $ver }
          $stage = 'output/msix-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # バックエンド
          Copy-Item output/backend-pub/* $stage -Recurse -Force
          # WebView2ラッパー
          $appDir = 'dist/ShineosQA.App'
          foreach ($f in 'ShineosQA.exe','Microsoft.Web.WebView2.Core.dll','Microsoft.Web.WebView2.Wpf.dll','WebView2Loader.dll') {
            Copy-Item "$appDir/$f" $stage -Force
          }
          # エンジン（モデルは同梱しない: 初回起動時のウィザードでアプリ内DL）
          Copy-Item spikes/phase0/engine/cpu/* "$stage/engine" -Recurse -Force
          # ライセンス
          Copy-Item vendor/licenses/* "$stage/licenses" -Recurse -Force
          Copy-Item vendor/THIRD-PARTY-NOTICES.txt $stage -Force

          # ロゴ生成
          New-Item -ItemType Directory -Path "$stage/assets" -Force | Out-Null
          Copy-Item assets/store-logo-300.png "$stage/assets/" -Force
          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Bitmap]::FromFile((Resolve-Path 'assets/store-logo-300.png'))
          foreach ($size in @(150, 44, 50)) {
            $bmp = New-Object System.Drawing.Bitmap($size, $size)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = 'HighQualityBicubic'
            $g.DrawImage($src, 0, 0, $size, $size)
            $g.Dispose()
            $name = if ($size -eq 150) { 'Square150x150Logo.png' } elseif ($size -eq 44) { 'Square44x44Logo.png' } else { 'StoreLogo.png' }
            $bmp.Save("$stage/assets/$name", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }
          $src.Dispose()

          # マニフェスト（日本語はmakeappx検証で落ちるため英字化・Store掲載文は別途言語ごとに設定）
          $manifest = Get-Content installer/msix/AppxManifest.xml -Raw
          $manifest = $manifest -replace 'Version="2\.0\.3\.0"', "Version=`"$msixVer`""
          $manifest = $manifest -replace '<DisplayName>[^<]+</DisplayName>', '<DisplayName>ShineosQA</DisplayName>'
          $manifest = $manifest -replace '<PublisherDisplayName>[^<]+</PublisherDisplayName>', '<PublisherDisplayName>ShineosQA</PublisherDisplayName>'
          $manifest = $manifest -replace 'Description="[^"]*"', 'Description="ShineosQA internal QA tool"'
          $manifest = $manifest -replace 'DisplayName="[^"]*"', 'DisplayName="ShineosQA"'
          # UTF-8 BOMなし（makeappx要件）
          [IO.File]::WriteAllText("$stage/AppxManifest.xml", $manifest, (New-Object Text.UTF8Encoding($false)))

          # パック（Store再署名のため署名はしない）
          $msixPath = "dist/ShineosQA-$msixVer.msix"
          & $makeappx pack /d $stage /p $msixPath /nv
          if ($LASTEXITCODE -ne 0) { throw 'makeappx failed' }
          Write-Output "MSIX built: $msixPath ($([math]::Round((Get-Item $msixPath).Length/1GB,2)) GB)"

      # ---- 8) Actions成果物（EXE + MSIX） ----
      - name: Upload installer artifact (EXE)
        uses: actions/upload-artifact@v4
        with:
          name: ShineosQA-Setup-${{ steps.ver.outputs.version }}
          path: dist/ShineosQA-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload installer artifact (MSIX)
        uses: actions/upload-artifact@v4
        with:
          name: ShineosQA-MSIX-${{ steps.ver.outputs.version }}
          path: dist/ShineosQA-*.msix
          if-no-files-found: error
          compression-level: 0

      # ---- 9) Release添付（exe >2GiB のため1GB分割+結合bat / MSIXは2GiB以下なら直接添付） ----
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $exe = "dist/ShineosQA-Setup-$ver.exe"
          $hash = '${{ steps.build.outputs.hash }}'
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --title "ShineosQA v$ver" --generate-notes --notes "SHA256(exe): $hash"
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          } else {
            gh release edit "$env:GITHUB_REF_NAME" --notes "SHA256(exe): $hash"
          }
          # exe: モデル非同梠のため1ファイル直接添付（2GiB未満）
          gh release upload "$env:GITHUB_REF_NAME" $exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload (exe) failed" }
          # MSIX: 2GiB以下なら直接、超過なら分割添付
          $msixFile = Get-ChildItem "dist/ShineosQA-*.msix" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msixFile -and $msixFile.Length -lt 2GB) {
            gh release upload "$env:GITHUB_REF_NAME" $msixFile.FullName --clobber
            Write-Output "MSIX uploaded directly: $($msixFile.Name)"
          } elseif ($msixFile) {
            $msixPart = "$($msixFile.FullName).part"
            New-Item -ItemType Directory -Force -Path $msixPart | Out-Null
            $msixFs = [IO.File]::OpenRead($msixFile.FullName)
            $msixBuf = New-Object byte[] (1GB)
            $mi = 0
            for (;;) {
              $mr = $msixFs.Read($msixBuf, 0, $msixBuf.Length)
              if ($mr -le 0) { break }
              $mi++
              $mOut = New-Object byte[] $mr
              [Array]::Copy($msixBuf, $mOut, $mr)
              [IO.File]::WriteAllBytes("$msixPart/msix-$ver.part$('{0:d2}' -f $mi)", $mOut)
            }
            $msixFs.Close()
            $msixName = $msixFile.Name
            Set-Content -Path "$msixPart/msix-join.bat" -Value "@echo off`r`ncopy /b msix-$ver.part* $msixName`r`necho MSIX created: $msixName`r`npause" -Encoding ASCII
            gh release upload "$env:GITHUB_REF_NAME" "$msixPart/*" --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload (msix parts) failed" }
            Write-Output "MSIX split into $mi parts and uploaded"
          }
          # リリースノートに単一ファイルDL先（Actions成果物）のリンクを追記
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          gh release view "$env:GITHUB_REF_NAME" --json body --jq '.body' | Out-File $notesFile -Encoding utf8
          Add-Content $notesFile -Value "`n---`n## 単一ファイルのダウンロード`n`n以下のActions成果物から単一ファイルを直接ダウンロードできます（GitHubログイン必要・90日保持）:`n`n- **EXE**: [ShineosQA-Setup-$ver]($runUrl) （Inno Setup版・2.2GB）`n- **MSIX**: [ShineosQA-MSIX-$ver]($runUrl) （Store提出用・2.2GB）`n"
          gh release edit "$env:GITHUB_REF_NAME" --notes-file $notesFile
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- EXE: 分割添付 + [Actions成果物]($runUrl)`n- MSIX: 分割添付 + [Actions成果物]($runUrl)（Store提出用）"
