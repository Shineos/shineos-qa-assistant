# CI: push/PRごとに Web UI ビルド+フロントテスト(vitest) と バックエンド単体テストを実行する。
# リリース成果物(インストーラ/署名)は release.yml(v*タグ)・sign-installer.yml(手動)が担う。
# windows-latest 必須: バックエンドテストプロジェクトが net10.0-windows TFM のため。
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build & test Web UI
        working-directory: app/ShineosQA.Web
        run: |
          npm ci
          npm run build
          npm test

      - name: Run backend tests
        run: dotnet test app/ShineosQA.Backend.Tests -c Release --nologo
