# 社内知恵袋 v2 - インストーラ署名ワークフロー（SignPath Foundation）
#
# - 手動実行（workflow_dispatch）: 軽量インストーラをビルドし、SignPath REST API
#   （scripts/sign_with_signpath.ps1）で SignPath Foundation のコード署名証明書で署名する。
#   Microsoft Store ポリシー 10.2.9（Microsoft Trusted Root Program 参加CA発行の
#   コード署名証明書）対応用。
# - 署名ポリシーが手動承認を要求する場合、signpath.io で Approver が承認するまで
#   このワークフローは待機する（最大60分）。
# - 成果物: 署名済み ShineosQA-Setup-<version>-lite.exe（Actions artifact）
name: sign-installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'インストーラのバージョン（例: 2.1.0）'
        required: false
        default: '2.1.0'
      sign_timeout_seconds:
        description: '署名完了待ち上限秒（手動承認待ちを含む）'
        required: false
        default: '3600'

permissions:
  contents: read

env:
  LLAMA_RELEASE_URL: https://github.com/ggml-org/llama.cpp/releases/download/b10936/llama-b10936-bin-win-cpu-x64.zip
  WEBVIEW2_NUGET: https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4129.50/microsoft.web.webview2.1.0.4129.50.nupkg

jobs:
  build-sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI
        shell: pwsh
        run: |
          cd app/ShineosQA.Web
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "web build failed" }

      - name: Publish backend
        shell: pwsh
        run: |
          dotnet publish app/ShineosQA.Backend -c Release -r win-x64 --self-contained true -o output/backend-pub
          if ($LASTEXITCODE -ne 0) { throw "backend publish failed" }
          Set-Content -Path output/backend-pub/version.txt -Value '${{ inputs.version || '2.1.0' }}'

      - name: Build WebView2 wrapper
        shell: pwsh
        run: |
          $dst = 'dist/ShineosQA.App'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP 'wv2.zip'
          curl.exe -L --fail --retry 3 -o $tmp $env:WEBVIEW2_NUGET
          if ($LASTEXITCODE -ne 0) { throw "webview2 nuget download failed" }
          $pkg = Join-Path $env:RUNNER_TEMP 'wv2'
          Expand-Archive $tmp -DestinationPath $pkg -Force
          Copy-Item "$pkg/lib/net462/Microsoft.Web.WebView2.Core.dll" $dst -Force
          Copy-Item "$pkg/lib/net462/Microsoft.Web.WebView2.Wpf.dll" $dst -Force
          Copy-Item "$pkg/runtimes/win-x64/native/WebView2Loader.dll" $dst -Force
          pwsh -NoProfile -ExecutionPolicy Bypass -File app/ShineosQA.App/build-v2.ps1
          if ($LASTEXITCODE -ne 0) { throw "wrapper build failed" }

      - name: Download llama.cpp engine
        shell: pwsh
        run: |
          $dst = 'spikes/phase0/engine/cpu'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP 'llama.zip'
          curl.exe -L --fail --retry 3 -o $tmp $env:LLAMA_RELEASE_URL
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp download failed" }
          Expand-Archive $tmp -DestinationPath $dst -Force
          if (-not (Test-Path "$dst/llama-server.exe")) { throw "llama-server.exe missing after extract" }

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $iscc = 'C:\InnoSetup\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            curl.exe -L --fail --retry 3 -o "$env:TEMP\innosetup.exe" https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup download failed" }
            $p = Start-Process -FilePath "$env:TEMP\innosetup.exe" `
              -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\InnoSetup') `
              -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Inno Setup installer exit code: $($p.ExitCode)" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

      - name: Build installer (lite)
        shell: pwsh
        run: |
          & 'C:\InnoSetup\ISCC.exe' "/DMyAppVersion=${{ inputs.version || '2.1.0' }}" '/DLiteBuild' 'installer/installer-v2.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (-not (Test-Path "dist/ShineosQA-Setup-${{ inputs.version || '2.1.0' }}-lite.exe")) { throw "installer not found" }

      - name: Sign with SignPath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $exe = "dist/ShineosQA-Setup-${{ inputs.version || '2.1.0' }}-lite.exe"
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/sign_with_signpath.ps1 `
            -ArtifactPath $exe -OutputPath $exe `
            -TimeoutSeconds ([int]'${{ inputs.sign_timeout_seconds || '3600' }}')
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }

      - name: Verify signature
        shell: pwsh
        run: |
          $exe = "dist/ShineosQA-Setup-${{ inputs.version || '2.1.0' }}-lite.exe"
          $sig = Get-AuthenticodeSignature $exe
          Write-Output "Status: $($sig.Status)"
          Write-Output "StatusMessage: $($sig.StatusMessage)"
          Write-Output "Signer: $($sig.SignerCertificate.Subject)"
          Write-Output "Issuer: $($sig.SignerCertificate.Issuer)"
          Write-Output "Algorithm: $($sig.SignerCertificate.SignatureAlgorithm.FriendlyName)"
          Write-Output "NotAfter: $($sig.SignerCertificate.NotAfter)"
          # ランナーの信頼ストアにルートが無くてもチェーン構成は検査する
          # （Certum 等 Microsoft Trusted Root Program 参加CAはストア不在で NotTrusted になることがある。
          #   Store審査はサービス側で信頼ルートを検証するため、ここではチェーンの素性を出力するだけにする）
          $chain = New-Object System.Security.Cryptography.X509Certificates.X509Chain
          $chain.ChainPolicy.RevocationMode = 'NoCheck'
          $chain.ChainPolicy.VerificationFlags = 'AllowUnknownCertificateAuthority'
          $null = $chain.Build($sig.SignerCertificate)
          foreach ($el in $chain.ChainElements) {
            Write-Output "CHAIN ELEMENT: $($el.Certificate.Subject)  [ISSUER: $($el.Certificate.Issuer)]"
          }
          if ($sig.Status -eq 'UnknownError' -or $sig.Status -eq 'NotTrusted') {
            Write-Output "::warning::Signature status is $($sig.Status) on this runner (root not in local trust store). Verify the chain terminates at a Microsoft Trusted Root Program CA (e.g., Certum) before submitting to the Store."
          }
          elseif ($sig.Status -ne 'Valid') {
            throw "signature invalid: $($sig.Status) / $($sig.StatusMessage)"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Output "SHA256: $hash"

      - name: Upload to R2 (Store package URL)
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          VERSION: ${{ inputs.version || '2.1.0' }}
        run: |
          if (-not $env:VERSION) { throw "VERSION input is empty" }
          $version = $env:VERSION
          $exe = "dist/ShineosQA-Setup-$version-lite.exe"
          if (-not (Test-Path $exe)) { throw "installer not found: $exe" }
          if (-not $env:R2_ACCESS_KEY_ID -or -not $env:R2_SECRET_ACCESS_KEY -or -not $env:CF_ACCOUNT_ID) {
            Write-Output "::warning::R2 credentials not configured (secrets: R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / CF_ACCOUNT_ID) — skipping automatic upload. Upload '$exe' to the shineos-downloads bucket (Store package URL) manually."
            exit 0
          }
          # 署名済みlite(約53MB)は300MB未満のため単一PUTで可能。aws s3 cp は大きい場合も
          # 自動マルチパートするため旧Worker(cron+手動後片付け)は不要になる
          aws s3 cp $exe "s3://shineos-downloads/ShineosQA-Setup-$version-lite.exe" --endpoint-url "https://$env:CF_ACCOUNT_ID.r2.cloudflarestorage.com"
          if ($LASTEXITCODE -ne 0) { throw "R2 upload failed" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $pub = "https://pub-cbe981f96fcc423d8c28124ab0fccba5.r2.dev/ShineosQA-Setup-$version-lite.exe"
          # 公開URLの整合確認(r2.dev公開アクセス経由)
          $head = (curl.exe -s -I --max-time 20 $pub | Out-String)
          if ($head -notmatch "200") { throw "R2 object not publicly reachable after upload: $pub" }
          Write-Output "uploaded to R2: $pub"
          Write-Output "SHA256 (uploaded): $hash"

      - name: Submission sheet (Partner Center)
        shell: pwsh
        env:
          VERSION: ${{ inputs.version || '2.1.0' }}
        run: |
          # 注意: VERSIONはenv経由。PowerShell変数 $VERSION は未定義(null)になるため必ず代入する
          if (-not $env:VERSION) { throw "VERSION input is empty" }
          $version = $env:VERSION
          $exe = "dist/ShineosQA-Setup-$version-lite.exe"
          if (-not (Test-Path $exe)) { throw "installer not found: $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          $url = "https://pub-cbe981f96fcc423d8c28124ab0fccba5.r2.dev/ShineosQA-Setup-$version-lite.exe"
          $sheet = @"

          ## Partner Center 提出用シート (v$version)

          | 項目 | 値 |
          |---|---|
          | パッケージURL（新規オブジェクト・EXE更新は新URL原則） | $url |
          | バイト数 | $size |
          | SHA256 | ``$hash`` |
          | アーキテクチャ / 言語 / 種類 | x64 / 日本語(ja) / EXE |
          | サイレントパラメータ | /VERYSILENT /SUPPRESSMSGBOXES /NORESTART |
          | 審査メモ | docs/store-submission.md §13（exe名を v$version-lite に読み替えて貼り付け） |

          提出後: パッケージURLの実DLでSHA256を再検証し、docs/store-submission.md §5.1 の行を本値へ更新してください。
          "@
          $sheet | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Write-Output $sheet

      - name: Upload signed installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShineosQA-Setup-${{ inputs.version || '2.1.0' }}-lite-signed
          path: dist/ShineosQA-Setup-${{ inputs.version || '2.1.0' }}-lite.exe
          if-no-files-found: error
          compression-level: 0
